name = "nodetick"
main = "src/index.ts"
compatibility_date = "2025-05-05"

# Import schema.sql as a text module (used by the auto-init in src/db.ts).
[[rules]]
type = "Text"
globs = ["**/*.sql"]

# Serve the React SPA (webapp/) as static assets with SPA fallback, while
# API routes always hit the worker. Build with: npm run build -w webapp
[assets]
directory = "../webapp/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/oauth/*", "/open/v1/*"]

# The D1 database is auto-initialized on first request (see src/db.ts).
# Create it with:  npx wrangler d1 create nodetick-db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "nodetick-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Public Web Push configuration. Keep VAPID_PRIVATE_KEY in a Wrangler secret.
# VAPID_PUBLIC_KEY = "replace-with-your-public-vapid-key"
# VAPID_SUBJECT = "mailto:admin@example.com"

[triggers]
crons = ["* * * * *"]

# Secrets (set with `npx wrangler secret put ...`):
#   SESSION_SECRET - random 32+ char string used to sign CSRF tokens
#   VAPID_PRIVATE_KEY - private half of the Web Push VAPID key pair
